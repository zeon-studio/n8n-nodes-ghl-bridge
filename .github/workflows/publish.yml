# Publish workflow for n8n community node
# This workflow builds the package and publishes to npm with a provenance statement.
# Required for n8n Creator Portal verification.

name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build package
        run: npm run build
      - name: Publish with provenance
        run: npm publish --access public --provenance
