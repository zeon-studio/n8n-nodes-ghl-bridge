# Publish workflow for n8n community node
# This workflow builds the package and publishes to npm with a provenance statement.
# Required for n8n Creator Portal verification.

name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm client
        run: npm install -g npm@latest
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build package
        run: npm run build
      - name: Publish with provenance
        run: npm publish --access public --provenance
